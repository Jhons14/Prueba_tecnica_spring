version: '3.8'

services:
  products-service:
    build:
      context: ./products-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - products-service
    networks:
      - microservices-network
    environment:
      - APP_PRODUCTS_SERVICE_URL=http://products-service:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  microservices-network:
    driver: bridge